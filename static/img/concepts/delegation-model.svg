<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="hdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a237e"/>
      <stop offset="100%" style="stop-color:#4a148c"/>
    </linearGradient>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1565c0"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c4dff"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#78909c"/>
    </marker>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="580" fill="#fafafa" rx="12"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="900" height="52" fill="url(#hdGrad)" rx="12"/>
  <rect x="0" y="30" width="900" height="22" fill="url(#hdGrad)"/>
  <text x="450" y="34" text-anchor="middle" fill="white" font-size="18" font-weight="bold">委派模型 — 六原语协作循环</text>
  
  <!-- User node (top center) -->
  <circle cx="450" cy="110" r="32" fill="#ff8f00" stroke="#e65100" stroke-width="2"/>
  <text x="450" y="106" text-anchor="middle" fill="white" font-size="13" font-weight="bold">👤</text>
  <text x="450" y="124" text-anchor="middle" fill="white" font-size="11">用户</text>
  
  <!-- Agent A (left) -->
  <rect x="120" y="200" width="160" height="60" rx="10" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
  <text x="200" y="225" text-anchor="middle" fill="white" font-size="13" font-weight="bold">🤖 智能体 A</text>
  <text x="200" y="245" text-anchor="middle" fill="#bbdefb" font-size="11">（被委派方/执行者）</text>
  
  <!-- Agent B (right) -->
  <rect x="620" y="200" width="160" height="60" rx="10" fill="#7c4dff" stroke="#6200ea" stroke-width="2"/>
  <text x="700" y="225" text-anchor="middle" fill="white" font-size="13" font-weight="bold">🤖 智能体 B</text>
  <text x="700" y="245" text-anchor="middle" fill="#e8daff" font-size="11">（可再委派/子任务）</text>
  
  <!-- User -> Agent A: delegate -->
  <path d="M 420 125 Q 300 160 250 195" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <rect x="260" y="140" width="120" height="24" rx="4" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="320" y="157" text-anchor="middle" fill="#1565c0" font-size="11" font-weight="bold">① delegate</text>
  
  <!-- Agent A -> Agent B: delegate -->
  <path d="M 280 220 L 615 220" fill="none" stroke="#7c4dff" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <rect x="390" y="195" width="120" height="22" rx="4" fill="#ede7f6" stroke="#7c4dff" stroke-width="1"/>
  <text x="450" y="210" text-anchor="middle" fill="#7c4dff" font-size="10" font-weight="bold">① delegate（链式）</text>
  
  <!-- Six primitives cycle (bottom area) -->
  <text x="450" y="300" text-anchor="middle" fill="#263238" font-size="14" font-weight="bold">六原语生命周期</text>
  
  <!-- Cycle nodes -->
  <!-- 1. delegate -->
  <rect x="60" y="330" width="115" height="44" rx="8" fill="#1565c0"/>
  <text x="117" y="349" text-anchor="middle" fill="white" font-size="11" font-weight="bold">① delegate</text>
  <text x="117" y="366" text-anchor="middle" fill="#bbdefb" font-size="9">发起委派</text>
  
  <!-- 2. execute -->
  <rect x="210" y="330" width="115" height="44" rx="8" fill="#00838f"/>
  <text x="267" y="349" text-anchor="middle" fill="white" font-size="11" font-weight="bold">② execute</text>
  <text x="267" y="366" text-anchor="middle" fill="#b2ebf2" font-size="9">执行任务</text>
  
  <!-- 3. report -->
  <rect x="360" y="330" width="115" height="44" rx="8" fill="#2e7d32"/>
  <text x="417" y="349" text-anchor="middle" fill="white" font-size="11" font-weight="bold">③ report</text>
  <text x="417" y="366" text-anchor="middle" fill="#c8e6c9" font-size="9">汇报进度</text>
  
  <!-- 4. receipt -->
  <rect x="510" y="330" width="115" height="44" rx="8" fill="#f57f17"/>
  <text x="567" y="349" text-anchor="middle" fill="white" font-size="11" font-weight="bold">④ receipt</text>
  <text x="567" y="366" text-anchor="middle" fill="#fff9c4" font-size="9">提交回执</text>
  
  <!-- 5. review -->
  <rect x="660" y="330" width="115" height="44" rx="8" fill="#c62828"/>
  <text x="717" y="349" text-anchor="middle" fill="white" font-size="11" font-weight="bold">⑤ review</text>
  <text x="717" y="366" text-anchor="middle" fill="#ffcdd2" font-size="9">审阅确认</text>
  
  <!-- 6. evolve -->
  <rect x="770" y="330" width="100" height="44" rx="8" fill="#6a1b9a"/>
  <text x="820" y="349" text-anchor="middle" fill="white" font-size="11" font-weight="bold">⑥ evolve</text>
  <text x="820" y="366" text-anchor="middle" fill="#e1bee7" font-size="9">学习进化</text>
  
  <!-- Arrows between cycle nodes -->
  <line x1="175" y1="352" x2="207" y2="352" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="325" y1="352" x2="357" y2="352" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="475" y1="352" x2="507" y2="352" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="625" y1="352" x2="657" y2="352" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowGray)"/>
  <line x1="775" y1="352" x2="768" y2="352" stroke="#546e7a" stroke-width="2" marker-end="url(#arrowGray)"/>
  
  <!-- Cycle back arrow -->
  <path d="M 820 374 Q 820 410 450 415 Q 117 410 117 378" fill="none" stroke="#78909c" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowGray)"/>
  <text x="450" y="432" text-anchor="middle" fill="#78909c" font-size="10">循环迭代：每次回执后可能触发新一轮委派</text>
  
  <!-- Key modes comparison -->
  <rect x="60" y="455" width="380" height="105" rx="8" fill="#e8eaf6" stroke="#7986cb" stroke-width="1.5"/>
  <text x="80" y="478" fill="#1a237e" font-size="12" font-weight="bold">🔄 同步模式 (sync)</text>
  <text x="80" y="498" fill="#37474f" font-size="11">委派方等待 → 执行方完成 → 返回结果</text>
  <text x="80" y="518" fill="#37474f" font-size="11">适用：简单/紧急任务，需要立即拿到结果</text>
  <text x="80" y="545" fill="#546e7a" font-size="10" font-style="italic">类比：打电话问问题，等对方回答</text>
  
  <rect x="460" y="455" width="400" height="105" rx="8" fill="#ede7f6" stroke="#b39ddb" stroke-width="1.5"/>
  <text x="480" y="478" fill="#4a148c" font-size="12" font-weight="bold">⚡ 异步模式 (async)</text>
  <text x="480" y="498" fill="#37474f" font-size="11">委派方继续工作 → 执行方后台完成 → 主动汇报</text>
  <text x="480" y="518" fill="#37474f" font-size="11">适用：耗时任务，不阻塞当前工作流</text>
  <text x="480" y="545" fill="#546e7a" font-size="10" font-style="italic">类比：发微信消息，对方忙完后回复</text>
</svg>