<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="-apple-system, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="hdGrad8" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#880e4f"/>
      <stop offset="100%" style="stop-color:#ad1457"/>
    </linearGradient>
    <linearGradient id="desireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4ec"/>
      <stop offset="100%" style="stop-color:#f8bbd0"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd"/>
      <stop offset="100%" style="stop-color:#bbdefb"/>
    </linearGradient>
  </defs>
  
  <rect width="900" height="440" fill="#fafafa" rx="12"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="900" height="50" fill="url(#hdGrad8)" rx="12"/>
  <rect x="0" y="28" width="900" height="22" fill="url(#hdGrad8)"/>
  <text x="450" y="32" text-anchor="middle" fill="white" font-size="17" font-weight="bold">命名理念 — Desire（意愿）+ Core（核心）</text>
  
  <!-- Desire side -->
  <rect x="40" y="65" width="380" height="165" rx="10" fill="url(#desireGrad)" stroke="#e91e63" stroke-width="2"/>
  <text x="230" y="90" text-anchor="middle" fill="#880e4f" font-size="15" font-weight="bold">Desire — 意愿与愿望</text>
  <text x="60" y="115" fill="#37474f" font-size="11">• 用户的意图、标准、边界、偏好</text>
  <text x="60" y="137" fill="#37474f" font-size="11">• 不只是即时请求，而是长期意愿与期望</text>
  <text x="60" y="159" fill="#37474f" font-size="11">• 解决"意图断裂"痛点</text>
  <text x="60" y="185" fill="#ad1457" font-size="10" font-weight="bold">核心动作：把对话中的意图持续沉淀为行为规范</text>
  <text x="60" y="210" fill="#78909c" font-size="10" font-style="italic">痛点：AI 永远是"没有记忆的临时工" → 意愿无法沉淀</text>
  
  <!-- Core side -->
  <rect x="480" y="65" width="380" height="165" rx="10" fill="url(#coreGrad)" stroke="#1565c0" stroke-width="2"/>
  <text x="670" y="90" text-anchor="middle" fill="#0d47a1" font-size="15" font-weight="bold">Core — 核心引擎</text>
  <text x="500" y="115" fill="#37474f" font-size="11">① 操作系统层：Agent OS 核心运行时</text>
  <text x="500" y="137" fill="#37474f" font-size="11">② 沉淀层：用户意图的核心沉淀层</text>
  <text x="500" y="163" fill="#1565c0" font-size="10" font-weight="bold">五类核心资产：</text>
  <text x="500" y="183" fill="#37474f" font-size="10">Persona(人格) · Playbook(手册) · Memory(记忆)</text>
  <text x="500" y="201" fill="#37474f" font-size="10">Tool Body(工具) · Receipts(回执)</text>
  <text x="500" y="221" fill="#78909c" font-size="10" font-style="italic">零散对话 → 凝结为智能体的核心资产</text>
  
  <!-- Connection arrow -->
  <path d="M 420 148 L 475 148" fill="none" stroke="#ad1457" stroke-width="3" marker-end="url(#arrD)"/>
  <text x="448" y="140" text-anchor="middle" fill="#ad1457" font-size="10" font-weight="bold">注入</text>
  
  <!-- Three perspectives -->
  <text x="450" y="260" text-anchor="middle" fill="#263238" font-size="13" font-weight="bold">三个视角理解 DesireCore</text>
  
  <rect x="40" y="275" width="260" height="70" rx="8" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
  <text x="60" y="298" fill="#880e4f" font-size="11" font-weight="bold">👤 用户视角</text>
  <text x="60" y="318" fill="#37474f" font-size="10">把你的"愿望"变成智能体的"内核"</text>
  <text x="60" y="336" fill="#37474f" font-size="10">教会智能体你想要什么</text>
  
  <rect x="320" y="275" width="260" height="70" rx="8" fill="#e8eaf6" stroke="#3f51b5" stroke-width="1.5"/>
  <text x="340" y="298" fill="#1a237e" font-size="11" font-weight="bold">⚙️ 系统视角</text>
  <text x="340" y="318" fill="#37474f" font-size="10">Agent OS 核心引擎</text>
  <text x="340" y="336" fill="#37474f" font-size="10">驱动 意图→规划→执行→回执 闭环</text>
  
  <rect x="600" y="275" width="260" height="70" rx="8" fill="#e0f2f1" stroke="#00695c" stroke-width="1.5"/>
  <text x="620" y="298" fill="#004d40" font-size="11" font-weight="bold">🤝 关系视角</text>
  <text x="620" y="318" fill="#37474f" font-size="10">智能体的"内心"(Core)</text>
  <text x="620" y="336" fill="#37474f" font-size="10">承载对用户意愿(Desire)的理解与承诺</text>
  
  <!-- Paradigm shift -->
  <rect x="40" y="365" width="820" height="55" rx="8" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="60" y="388" fill="#263238" font-size="12" font-weight="bold">交互范式升级</text>
  <text x="60" y="410" fill="#37474f" font-size="11">人问AI答 → 人教AI做事 ｜ 下指令给工具 → 培养智能体 ｜ 一次性Prompt → 意愿沉淀为长期规范 ｜ Interaction → Delegation</text>
</svg>