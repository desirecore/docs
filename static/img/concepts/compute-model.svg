<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="hdGrad5" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a148c"/>
      <stop offset="100%" style="stop-color:#7b1fa2"/>
    </linearGradient>
    <marker id="arrP" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7b1fa2"/>
    </marker>
  </defs>
  
  <rect width="900" height="500" fill="#fafafa" rx="12"/>
  
  <!-- Title -->
  <rect x="0" y="0" width="900" height="50" fill="url(#hdGrad5)" rx="12"/>
  <rect x="0" y="28" width="900" height="22" fill="url(#hdGrad5)"/>
  <text x="450" y="32" text-anchor="middle" fill="white" font-size="17" font-weight="bold">算力模型 — BYOK + 云端 + 多供应商</text>
  
  <!-- DesireCore center -->
  <rect x="340" y="70" width="220" height="55" rx="10" fill="#263238" stroke="#455a64" stroke-width="2"/>
  <text x="450" y="93" text-anchor="middle" fill="white" font-size="14" font-weight="bold">DesireCore</text>
  <text x="450" y="112" text-anchor="middle" fill="#b0bec5" font-size="10">算力调度中心（不内置模型）</text>
  
  <!-- Two paths -->
  <line x1="380" y1="125" x2="220" y2="160" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrP)"/>
  <line x1="520" y1="125" x2="680" y2="160" stroke="#7b1fa2" stroke-width="2.5" marker-end="url(#arrP)"/>
  
  <!-- BYOK path (left) -->
  <rect x="60" y="160" width="320" height="155" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <rect x="60" y="160" width="320" height="28" rx="10" fill="#1565c0"/>
  <rect x="60" y="176" width="320" height="12" fill="#1565c0"/>
  <text x="220" y="179" text-anchor="middle" fill="white" font-size="12" font-weight="bold">🔑 BYOK 自带钥匙模式</text>
  <text x="80" y="206" fill="#37474f" font-size="11">• 你注册供应商账号，获取 API Key</text>
  <text x="80" y="226" fill="#37474f" font-size="11">• 填入 DesireCore 设置</text>
  <text x="80" y="246" fill="#37474f" font-size="11">• 费用直接由供应商结算</text>
  <text x="80" y="270" fill="#1565c0" font-size="10" font-weight="bold">优势：透明计费 · 自由选择 · 数据安全 · 成本可控</text>
  <text x="80" y="300" fill="#78909c" font-size="10" font-style="italic">类比：自助餐厅自带食材，餐厅提供厨房</text>
  
  <!-- Cloud path (right) -->
  <rect x="520" y="160" width="320" height="155" rx="10" fill="#ede7f6" stroke="#7b1fa2" stroke-width="2"/>
  <rect x="520" y="160" width="320" height="28" rx="10" fill="#7b1fa2"/>
  <rect x="520" y="176" width="320" height="12" fill="#7b1fa2"/>
  <text x="680" y="179" text-anchor="middle" fill="white" font-size="12" font-weight="bold">☁️ 官方云端算力</text>
  <text x="540" y="206" fill="#37474f" font-size="11">• 登录账号即可使用</text>
  <text x="540" y="226" fill="#37474f" font-size="11">• 按订阅或 credit 计费</text>
  <text x="540" y="246" fill="#37474f" font-size="11">• 模型列表自动同步</text>
  <text x="540" y="270" fill="#7b1fa2" font-size="10" font-weight="bold">特点：开箱即用 · 可与 BYOK 并存 · 不锁定</text>
  <text x="540" y="300" fill="#78909c" font-size="10" font-style="italic">类比：餐厅也提供食材套餐，随时可换自带</text>
  
  <!-- Provider categories -->
  <rect x="40" y="340" width="820" height="140" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="1.5"/>
  <text x="60" y="365" fill="#263238" font-size="13" font-weight="bold">🌐 20+ 供应商生态</text>
  
  <rect x="60" y="378" width="185" height="85" rx="6" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <text x="75" y="398" fill="#1565c0" font-size="11" font-weight="bold">国际供应商</text>
  <text x="75" y="416" fill="#37474f" font-size="9">OpenAI · Anthropic</text>
  <text x="75" y="432" fill="#37474f" font-size="9">Google · Mistral · xAI</text>
  <text x="75" y="448" fill="#37474f" font-size="9">Cohere · Perplexity</text>
  
  <rect x="260" y="378" width="185" height="85" rx="6" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <text x="275" y="398" fill="#c62828" font-size="11" font-weight="bold">国内供应商</text>
  <text x="275" y="416" fill="#37474f" font-size="9">DeepSeek · 通义千问</text>
  <text x="275" y="432" fill="#37474f" font-size="9">豆包 · Kimi · GLM</text>
  <text x="275" y="448" fill="#37474f" font-size="9">文心 · 混元</text>
  
  <rect x="460" y="378" width="185" height="85" rx="6" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <text x="475" y="398" fill="#2e7d32" font-size="11" font-weight="bold">聚合 + 本地</text>
  <text x="475" y="416" fill="#37474f" font-size="9">OpenRouter · 硅基流动</text>
  <text x="475" y="432" fill="#37474f" font-size="9">Ollama（本地离线）</text>
  <text x="475" y="448" fill="#37474f" font-size="9">本地 Whisper</text>
  
  <rect x="660" y="378" width="180" height="85" rx="6" fill="white" stroke="#90a4ae" stroke-width="1"/>
  <text x="675" y="398" fill="#e65100" font-size="11" font-weight="bold">创意生成</text>
  <text x="675" y="416" fill="#37474f" font-size="9">Stability AI（图像）</text>
  <text x="675" y="432" fill="#37474f" font-size="9">可灵（视频）</text>
  <text x="675" y="448" fill="#37474f" font-size="9">MiniMax（音乐）</text>
  
  <!-- Model selection note -->
  <text x="450" y="495" text-anchor="middle" fill="#546e7a" font-size="10">模型选择策略：chat(旗舰) · fast(轻量) · reasoning(推理) · vision(多模态) · embedding · tts · asr — 可自定义映射</text>
</svg>