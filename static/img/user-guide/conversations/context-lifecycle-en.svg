<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 335" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <rect width="700" height="335" fill="url(#bg2)" rx="12"/>
  <text x="350" y="30" text-anchor="middle" fill="#e0e0e0" font-size="14" font-weight="600">Context Lifecycle</text>
  <!-- Timeline arrow -->
  <line x1="50" y1="80" x2="650" y2="80" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="rgba(255,255,255,0.4)"/></marker></defs>
  <!-- Messages on timeline -->
  <circle cx="100" cy="80" r="6" fill="#4ade80"/>
  <text x="100" y="70" text-anchor="middle" fill="#94a3b8" font-size="8">Message 1</text>
  <circle cx="180" cy="80" r="6" fill="#4ade80"/>
  <text x="180" y="70" text-anchor="middle" fill="#94a3b8" font-size="8">Message 2</text>
  <circle cx="260" cy="80" r="6" fill="#4ade80"/>
  <text x="260" y="70" text-anchor="middle" fill="#94a3b8" font-size="8">Message 3</text>
  <circle cx="340" cy="80" r="6" fill="#60a5fa"/>
  <text x="340" y="70" text-anchor="middle" fill="#60a5fa" font-size="8">/compact</text>
  <circle cx="420" cy="80" r="6" fill="#4ade80"/>
  <text x="420" y="70" text-anchor="middle" fill="#94a3b8" font-size="8">Message 4</text>
  <circle cx="500" cy="80" r="6" fill="#4ade80"/>
  <text x="500" y="70" text-anchor="middle" fill="#94a3b8" font-size="8">Message 5</text>
  <circle cx="580" cy="80" r="6" fill="#f472b6"/>
  <text x="580" y="70" text-anchor="middle" fill="#f472b6" font-size="8">/new</text>
  <!-- Compact zone -->
  <rect x="70" y="100" width="240" height="80" rx="8" fill="rgba(96,165,250,0.08)" stroke="rgba(96,165,250,0.3)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="190" y="125" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="500">Compacted Summary</text>
  <text x="190" y="145" text-anchor="middle" fill="#94a3b8" font-size="9">Key points from messages 1–3</text>
  <text x="190" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">Original content remains available</text>
  <!-- Active context -->
  <rect x="350" y="100" width="200" height="80" rx="8" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.3)" stroke-width="1"/>
  <text x="450" y="125" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="500">Active Context</text>
  <text x="450" y="145" text-anchor="middle" fill="#94a3b8" font-size="9">Summary + recent messages</text>
  <text x="450" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">What the model actually reads</text>
  <!-- New boundary -->
  <rect x="560" y="100" width="90" height="80" rx="8" fill="rgba(244,114,182,0.08)" stroke="rgba(244,114,182,0.3)" stroke-width="1"/>
  <text x="605" y="125" text-anchor="middle" fill="#f472b6" font-size="10" font-weight="500">New Boundary</text>
  <text x="605" y="145" text-anchor="middle" fill="#94a3b8" font-size="9">Earlier content</text>
  <text x="605" y="162" text-anchor="middle" fill="#94a3b8" font-size="9">no longer read</text>
  <!-- Legend -->
  <rect x="50" y="210" width="600" height="110" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="70" y="235" fill="#e0e0e0" font-size="11" font-weight="500">Command Comparison</text>
  <circle cx="80" cy="258" r="5" fill="#60a5fa"/>
  <text x="95" y="262" fill="#94a3b8" font-size="9">/compact — Summarize older messages to preserve continuity during a long task</text>
  <circle cx="80" cy="280" r="5" fill="#f472b6"/>
  <text x="95" y="284" fill="#94a3b8" font-size="9">/new — Start fresh context when switching to an unrelated topic</text>
  <circle cx="80" cy="302" r="5" fill="#ff9500"/>
  <text x="95" y="306" fill="#94a3b8" font-size="9">Auto-compaction — Triggered near the context limit; no manual action needed</text>
</svg>
